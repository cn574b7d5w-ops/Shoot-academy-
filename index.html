function hdr(){var h={"Content-Type":"application/json",apikey:SUPA_KEY};if(SUPA_KEY.indexOf("eyJ")===0)h.Authorization="Bearer "+SUPA_KEY;return h}
function rpc(fn,args){
  if(SUPA_KEY.indexOf("PASTE")===0)return Promise.reject(new Error("SETUP"));
  return fetch(SUPA_URL+"/rest/v1/rpc/"+fn,{method:"POST",
    headers:hdr(),
    body:JSON.stringify(args||{})}).then(function(r){return r.text().then(function(t){
      var j;try{j=t?JSON.parse(t):null}catch(e){j=null}
      if(!r.ok)throw new Error((j&&(j.message||j.hint))||"ERR");
      return j})});
}

    r.lines.forEach(function(x,i){t+=(i+1)+") "+x.name+(x.size?"\n   المقاس: "+szl(x.cat,x.size):"")+"\n   الكمية: "+x.qty+((x.nm||x.no)?"\n   على الظهر: "+(x.nm||"-")+(x.no?" | الرقم: "+x.no:""):"")+"\n   السعر: "+money(x.sum)+"\n"});
    t+="──────────\nالمجموع: "+money(r.total)+(f.ox?"\nملاحظات: "+f.ox:"")+"\n\nالدفع: بنفت "+(I.benefit||"")+" / آيبان "+(I.iban||"")+"\nسأرفق صورة إيصال التحويل هنا ✅";
    var url=waUrl(I.wa||WA[0],t);SHOP.cart=[];cartSave();SHOP.f={};
    render(shell('<div class="card" style="text-align:center"><h2>تم تسجيل طلبك ✅</h2><p>رقم الطلب: <b>#'+r.no+'</b><br>المجموع: <b>'+money(r.total)+'</b></p><p class="muted">اضغط الزر التالي لفتح واتساب وإرسال الطلب، ثم أرفق صورة إيصال التحويل. لن يتم تجهيز الطلب قبل وصول الإيصال.</p><a class="wa" href="'+esc(url)+'" target="_blank" rel="noopener">💬 إرسال الطلب إلى واتساب</a></div>'+payBox()+'<button class="btn ghost block" onclick="shop()">الرجوع للمتجر</button>',{back:"home()",bg:"hero",title:"شكراً لك",sub:"Order received"}));
    setTimeout(function(){location.href=url},400);
  }).catch(function(x){b.disabled=false;b.textContent="إرسال الطلب عبر واتساب";e.textContent=errMsg(x)});
}

/* --- إدارة المنتجات والطلبات (للمدير) --- */
var AP={list:[],info:{},img:undefined};
function pthumb(p){return pimg(p,1)}
function viewProd(){Promise.all([rpc("admin_shop_list",{p_tok:S.tok}),rpc("shop_info")]).then(function(r){AP.list=r[0];AP.info=r[1]||{};drawProd()}).catch(authFail)}
function drawProd(){
  var I=AP.info,h='<div class="card"><h2>بيانات الدفع والطلبات</h2><div class="muted">تظهر للزبون عند إتمام الطلب.</div>'+
   [["benefit","رقم بنفت"],["iban","رقم الآيبان"],["holder","اسم صاحب الحساب"],["wa","رقم واتساب استقبال الطلبات"]].map(function(f){return'<label>'+f[1]+'</label><div class="row"><input id="ss_'+f[0]+'" value="'+esc(I[f[0]]||"")+'" style="margin:0"><button class="btn sm fit" onclick="saveSet(\''+f[0]+'\')">حفظ</button></div>'}).join("")+'</div>'+
   '<div class="card"><div class="row sp"><h2 style="margin:0">المنتجات ('+AP.list.length+')</h2><button class="btn red sm fit" onclick="editProd(null)">+ منتج</button></div><div class="muted">لا يظهر المنتج للزبائن إلا إذا فعّلته وحددت سعره.</div></div>';
  AP.list.forEach(function(p){h+='<div class="pl static"><div class="pt">'+pthumb(p)+'</div><div style="flex:1"><div class="n">'+esc(p.name)+'</div><div class="c">'+catAr(p.cat)+' • '+money(p.price)+'</div><div style="margin-top:4px">'+(p.active?'<span class="tag grn">ظاهر</span>':'<span class="tag">مخفي</span>')+(p.soldout?' <span class="tag red">نفد</span>':'')+'</div></div><button class="btn ghost sm fit" onclick="editProd(\''+p.id+'\')">تعديل</button></div>'});
  $("cb").innerHTML=h;fillG($("cb"));
}
function saveSet(k){rpc("admin_set_shop",{p_tok:S.tok,p_k:k,p_v:$("ss_"+k).value}).then(function(){toast("تم الحفظ");AP.info[k]=$("ss_"+k).value}).catch(authFail)}
function editProd(id){
  var p=null;AP.list.forEach(function(x){if(x.id===id)p=x});AP.edit=id;AP.img=undefined;
  var co=CATS.map(function(c){return'<option value="'+c[0]+'"'+((p?p.cat:"tshirt")===c[0]?" selected":"")+'>'+c[1]+'</option>'}).join("");
  $("cb").innerHTML='<div class="card"><h2>'+(p?"تعديل منتج":"منتج جديد")+'</h2><label style="margin-top:0">اسم المنتج</label><input id="pr_n" value="'+esc(p?p.name:"")+'">'+
   '<label>النوع</label><select id="pr_c" onchange="prCat()">'+co+'</select>'+
   '<label>السعر (د.ب)</label><input id="pr_p" type="number" inputmode="decimal" step="0.5" min="0" value="'+(p?p.price:"")+'">'+
   '<label>المقاسات (مفصولة بفاصلة، اتركها فارغة إن لم يكن للمنتج مقاسات)</label><input id="pr_s" value="'+esc(p?(p.sizes||[]).join(","):PRE.tshirt)+'" class="ltr">'+
   '<label>الاسم ورقم اللاعب على الظهر</label><select id="pr_u"><option value="0">غير متاح</option><option value="1"'+(p&&p.custom||!p?" selected":"")+'>متاح (تيشيرت/جاكيت/هودي)</option></select>'+
   '<label>الحالة</label><select id="pr_a"><option value="1"'+(p&&p.active?" selected":"")+'>ظاهر في المتجر</option><option value="0"'+(p&&!p.active?" selected":"")+(p?"":" selected")+'>مخفي</option></select>'+
   '<label>التوفر</label><select id="pr_o"><option value="0">متوفر</option><option value="1"'+(p&&p.soldout?" selected":"")+'>نفد</option></select>'+
   '<label>الصورة</label><div class="row" style="margin-top:6px"><div id="pr_v" class="pt fit">'+(p?pthumb(p):'🛍️')+'</div><input type="file" accept="image/*" onchange="prImg(this)" style="margin:0"></div>'+
   '<div class="row" style="margin-top:14px"><button class="btn red" id="pr_b" onclick="saveProd()">حفظ</button><button class="btn ghost" onclick="viewProd()">إلغاء</button></div>'+
   (p?'<button class="btn ghost block" style="color:var(--no)" onclick="delProd()">حذف المنتج</button>':'')+'</div>';
  fillG($("cb"));
}
function prCat(){var c=$("pr_c").value,s=$("pr_s").value.trim(),isPre=!s;for(var k in PRE)if(PRE[k]===s)isPre=true;if(isPre)$("pr_s").value=PRE[c]||"";$("pr_u").value=(c==="tshirt"||c==="jacket"||c==="hoodie")?"1":"0"}
function prImg(inp){var f=inp.files&&inp.files[0];if(!f)return;upImg(f,800,.75,function(d){AP.img=d;$("pr_v").innerHTML='<img src="'+d+'" alt="">'})}
function saveProd(){
  var n=$("pr_n").value.trim(),pr=parseFloat($("pr_p").value);
  if(n.length<2){toast("اكتب اسم المنتج");return}
  if(isNaN(pr)||pr<0){toast("اكتب السعر");return}
  if($("pr_a").value==="1"&&pr<=0){toast("حدد السعر قبل إظهار المنتج");return}
  var sz=$("pr_s").value.split(/[,،\s]+/).filter(Boolean);
  $("pr_b").disabled=true;
  rpc("admin_product_save",{p_tok:S.tok,p_id:AP.edit,p_name:n,p_cat:$("pr_c").value,p_price:pr,p_sizes:sz,p_custom:$("pr_u").value==="1",p_active:$("pr_a").value==="1",p_soldout:$("pr_o").value==="1",p_img:AP.img===undefined?null:AP.img})
   .then(function(){toast("تم الحفظ");viewProd()}).catch(function(e){$("pr_b").disabled=false;authFail(e)});
}
function delProd(){if(!confirm("حذف هذا المنتج نهائياً؟"))return;rpc("admin_product_del",{p_tok:S.tok,p_id:AP.edit}).then(function(){toast("تم الحذف");viewProd()}).catch(authFail)}
var OST=[["new","جديد"],["paid","مدفوع"],["ready","جاهز للاستلام"],["done","تم التسليم"],["cancel","ملغي"]];
function viewOrd(){rpc("admin_orders",{p_tok:S.tok}).then(function(l){
  var h='<div class="card"><h2>الطلبات ('+l.length+')</h2><div class="muted">آخر 100 طلب. غيّر الحالة بعد استلام الإيصال في الواتساب.</div></div>';
  if(!l.length)h+='<div class="card"><p class="muted">لا توجد طلبات بعد.</p></div>';
  l.forEach(function(o){
    h+='<div class="card"><div class="row sp"><b>#'+o.no+' • '+fmt(o.day)+'</b><select style="width:auto;margin:0" onchange="setOrd(\''+o.id+'\',this.value)">'+OST.map(function(s){return'<option value="'+s[0]+'"'+(o.status===s[0]?" selected":"")+'>'+s[1]+'</option>'}).join("")+'</select></div>'+
     '<div style="margin-top:8px"><b>'+esc(o.name)+'</b> • <a href="tel:'+esc(o.phone)+'" class="ltr">'+esc(o.phone)+'</a> • <a href="https://wa.me/'+(o.phone.length===8?"973":"")+esc(o.phone)+'" target="_blank" rel="noopener">واتساب</a></div>'+
     '<div class="muted">'+(o.player?'اللاعب: '+esc(o.player)+' • ':'')+(o.branch?'الاستلام: '+brn(o.branch).ar:'')+'</div>'+
     o.items.map(function(x){return'<div class="gl"><div style="flex:1"><div class="n">'+esc(x.name)+' × '+x.qty+'</div><div class="muted">'+[x.size?szl(x.cat,x.size):"",(x.nm||x.no)?"على الظهر: "+(x.nm||"-")+(x.no?" رقم "+x.no:""):""].filter(Boolean).map(esc).join(" • ")+'</div></div><div>'+money(x.sum)+'</div></div>'}).join("")+
     '<div class="row sp" style="margin-top:8px"><b>المجموع</b><b>'+money(o.total)+'</b></div>'+(o.note?'<div class="muted">ملاحظات: '+esc(o.note)+'</div>':'')+'</div>'});
  $("cb").innerHTML=h}).catch(authFail)}
function setOrd(id,s){rpc("admin_order_status",{p_tok:S.tok,p_id:id,p_status:s}).then(function(){toast("تم تحديث الحالة")}).catch(authFail)}

/* --- الإعلانات --- */
function viewAnn(){
  var h='<div class="card"><h2>إعلان جديد</h2><label style="margin-top:0">يظهر في</label><select id="ab">'+(S.role==="admin"?'<option value="">كل الفروع</option>':'')+allowed().map(function(b){return'<option value="'+b.id+'"'+(b.id===S.br?" selected":"")+'>'+b.ar+'</option>'}).join("")+'</select>'+
   '<label>العنوان</label><input id="at" placeholder="مثال: تأجيل تدريب الخميس"><label>التفاصيل</label><textarea id="ax"></textarea><button class="btn red block" onclick="addAnn()">نشر</button></div><div class="card"><h2>الإعلانات الحالية</h2>';
  h+=S.anns.length?S.anns.map(function(a){return'<div class="news"><div class="row sp"><b>'+esc(a.title)+'</b><button class="btn ghost sm fit" onclick="delAnn(\''+a.id+'\')">حذف</button></div><div>'+esc(a.body||"")+'</div><div class="muted">'+(a.branch?brn(a.branch).ar:"كل الفروع")+' • '+fmt(a.day)+'</div></div>'}).join(""):'<p class="muted">لا توجد إعلانات.</p>';
  $("cb").innerHTML=h+'</div>';
}
function addAnn(){var t=$("at").value;if(t.trim().length<2){toast("اكتب العنوان");return}
  rpc("coach_add_ann",{p_tok:S.tok,p_branch:$("ab").value,p_title:t,p_body:$("ax").value}).then(function(){toast("تم النشر");coachHome("ann")}).catch(authFail)}
function delAnn(id){if(!confirm("حذف الإعلان؟"))return;rpc("coach_del_ann",{p_tok:S.tok,p_id:id}).then(function(){coachHome("ann")}).catch(authFail)}

/* ====== التوجيه من الرابط ====== */
function route(){
  var h=location.hash,m;
  if((m=h.match(/^#\/p\/([0-9a-f-]{36})$/i)))return profile(m[1]);
  if((m=h.match(/^#\/b\/(\w+)$/)))return branch(m[1]);
  if(h==="#/shop")return shop();
  if(h==="#/parents")return parents();
  if(h==="#/coach")return coachLogin();
  home();
}
window.addEventListener("hashchange",function(){if(location.hash!==_cur){_cur=location.hash;route()}});
loadSlots();
route();
</script>
</body>
