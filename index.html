function hdr(){var h={"Content-Type":"application/json",apikey:SUPA_KEY};if(SUPA_KEY.indexOf("eyJ")===0)h.Authorization="Bearer "+SUPA_KEY;return h}
function rpc(fn,args){
  if(SUPA_KEY.indexOf("PASTE")===0)return Promise.reject(new Error("SETUP"));
  return fetch(SUPA_URL+"/rest/v1/rpc/"+fn,{method:"POST",
    headers:hdr(),
    body:JSON.stringify(args||{})}).then(function(r){return r.text().then(function(t){
      var j;try{j=t?JSON.parse(t):null}catch(e){j=null}
      if(!r.ok)throw new Error((j&&(j.message||j.hint))||"ERR");
      return j})});
}

    if(d.length>440000){toast(T("الصورة كبيرة، جرّب صورة أخرى","Image too large, try another one"));return}
    REG.img=d;$("rpv").innerHTML='<img src="'+d+'" alt="">';$("rt").textContent=T("تم رفع الصورة ✓","Photo added ✓");
  });
}
function regS2(){
  return'<div class="fc"><h2>'+T("ولي الأمر والحالة الصحية","Guardian & health")+'</h2>'+
   '<div class="fl"><label>'+T("رقم تواصل ولي الأمر 1","Guardian phone 1")+'</label><input id="rp1" type="tel" inputmode="tel" class="ltr" value="'+esc(REG.phone1)+'" placeholder="3XXXXXXX"></div>'+
   '<div class="fl"><label>'+T("رقم تواصل ولي الأمر 2 (اختياري)","Guardian phone 2 (optional)")+'</label><input id="rp2" type="tel" inputmode="tel" class="ltr" value="'+esc(REG.phone2)+'" placeholder="3XXXXXXX"></div>'+
   '<div class="fl"><label>'+T("هل يعاني اللاعب من أي أمراض؟","Does the player have any medical conditions?")+'</label><div class="seg"><button type="button" id="ill0" class="'+(REG.ill?"":"on")+'" onclick="regIll(false)">'+T("لا","No")+'</button><button type="button" id="ill1" class="'+(REG.ill?"on":"")+'" onclick="regIll(true)">'+T("نعم","Yes")+'</button></div>'+
   '<div id="rnw" style="display:'+(REG.ill?"block":"none")+'"><label>'+T("اذكر المرض أو الحساسية","Please describe the condition or allergy")+'</label><textarea id="rnote" maxlength="400">'+esc(REG.note)+'</textarea></div></div></div>';
}
function regIll(v){REG.ill=v;$("ill0").className=v?"":"on";$("ill1").className=v?"on":"";$("rnw").style.display=v?"block":"none"}
function dayChips(p){return p.days&&p.days.length?p.days.map(function(d){return'<span class="dy">'+dn(d)+'</span>'}).join(""):'<span class="muted">'+T("الأيام تُحدَّد عند التواصل","Days confirmed on contact")+'</span>'}
function regS3(){
  var h='<div class="fc"><h2>'+T("اختر الفرع","Choose a branch")+'</h2><div class="muted">'+T("أيام التدريب والرسوم لكل فرع، والوقت في جميع الفروع ","Training days and fees per branch. Time at all branches: ")+regTime()+'</div>';
  BR.forEach(function(b){var p=regPlan(b.id);if(!p)return;
    h+='<div class="bc'+(REG.branch===b.id?" on":"")+'" id="bc_'+b.id+'" onclick="regBr(\''+b.id+'\')"><div class="th" data-slot="b_'+b.id+'"></div><div style="flex:1;min-width:0"><b>'+T(b.ar,b.en)+'</b><div>'+dayChips(p)+'</div></div><div class="pr">'+money(p.price)+'</div></div>'});
  return h+'</div><div id="plan"></div>';
}
function regBr(id){
  regSave();REG.branch=id;REG.extra=false;if($("re"))$("re").textContent="";
  BR.forEach(function(b){var e=$("bc_"+b.id);if(e)e.className="bc"+(b.id===id?" on":"")});
  regPlanDraw();regBar();
}
function regExtra(){REG.extra=!REG.extra;regPlanDraw();regBar()}
function regPlanDraw(){
  var el=$("plan");if(!el)return;var p=regPlan(REG.branch);
  if(!p){el.innerHTML="";return}
  var h='<div class="fc"><h2>'+T("خطة الاشتراك","Your plan")+'</h2><div>'+dayChips(p)+'</div><div class="muted" style="margin-top:6px">🕓 '+regTime()+'</div>'+
   '<div class="row sp" style="margin-top:10px"><span>'+T("رسوم الاشتراك","Subscription fee")+'</span><b>'+money(p.price)+'</b></div>';
  if(p.extra_day)h+='<div class="xt'+(REG.extra?" on":"")+'" onclick="regExtra()"><div class="ck">'+(REG.extra?"✓":"+")+'</div><div style="flex:1"><b>'+T("إضافة يوم تدريب إضافي: ","Add an extra training day: ")+dn(p.extra_day)+'</b><div class="muted">'+regTime()+'</div></div><div class="pr">+'+money(p.extra_price)+'</div></div>';
  el.innerHTML=h+'</div>';
}
function regS4(){
  SHOP.info=REG.info.pay||{};
  var p=regPlan(REG.branch),b=brn(REG.branch);
  function r(l,v){return'<div class="rw"><span class="muted">'+l+'</span><b>'+v+'</b></div>'}
  var days=(p.days&&p.days.length?p.days.map(dn).join(" • "):T("تُحدَّد عند التواصل","Confirmed on contact"))+(REG.extra&&p.extra_day?" + "+dn(p.extra_day):"");
  return'<div class="fc"><h2>'+T("مراجعة التسجيل","Review")+'</h2>'+
   r(T("اللاعب","Player"),esc(REG.name))+r(T("الرقم الشخصي","Personal no."),'<span class="ltr">'+esc(REG.cpr)+'</span>')+
   r(T("ولي الأمر","Guardian"),'<span class="ltr">'+esc(REG.phone1)+(REG.phone2?" • "+esc(REG.phone2):"")+'</span>')+
   r(T("الحالة الصحية","Health"),REG.ill?esc(REG.note):T("لا يعاني من أمراض","No conditions"))+
   r(T("الفرع","Branch"),T(b.ar,b.en))+r(T("أيام التدريب","Training days"),days+'<br><span class="muted">'+regTime()+'</span>')+
   '<div class="rw tot"><span>'+T("إجمالي الرسوم","Total fee")+'</span><b>'+money(regTotal())+'</b></div>'+
   '<div style="margin-top:12px"><img class="idp" src="'+REG.img+'" alt=""></div></div>'+
   payBox()+'<div class="card"><div class="muted">'+T("بعد الإرسال يُفتح واتساب برسالة جاهزة بكل البيانات. حوّل الرسوم ثم أرفق صورة الإيصال في المحادثة لتأكيد التسجيل.","After submitting, WhatsApp opens with a ready message containing all the details. Transfer the fee, then attach the receipt photo in the chat to confirm registration.")+'</div>'+
   '<label class="agree"><input type="checkbox" id="rag"'+(REG.agree?" checked":"")+' onchange="REG.agree=this.checked"><span>'+T("اطّلعت على ","I have read ")+'<a href="javascript:void 0" onclick="regPolicy()">'+T("سياسة الأكاديمية","the Academy policy")+'</a>'+T(" وأوافق عليها"," and agree to it")+'</span></label></div>';
}
function regBar(){
  var o=document.querySelector(".regbar");if(o)o.remove();
  var s=REG.step,d=document.createElement("div");d.className="regbar";
  d.innerHTML=(s>1?'<button class="btn ghost" onclick="regPrev()">'+T("السابق","Back")+'</button>':'')+
   (s>=3&&REG.branch?'<div class="tt"><span class="muted">'+T("الرسوم","Fee")+'</span><b>'+money(regTotal())+'</b></div>':'<div class="tt"></div>')+
   (s<4?'<button class="btn red" onclick="regNext()">'+T("التالي","Next")+'</button>':'<button class="btn red" id="rsb" onclick="regSubmit()">'+T("إرسال التسجيل","Submit")+'</button>');
  document.body.appendChild(d);
}
function regErr(m){var e=$("re");if(e)e.textContent=m;toast(m);return false}
function regCheck(s){
  if(s===1){
    if(REG.name.trim().split(/\s+/).length<3)return regErr(T("اكتب اسم اللاعب الثلاثي","Enter the player's three names"));
    if(REG.cpr.replace(/\D/g,"").length!==9)return regErr(T("الرقم الشخصي يجب أن يكون 9 أرقام","The personal number must be 9 digits"));
    if(!REG.img)return regErr(T("ارفع صورة البطاقة الشخصية","Upload the ID card photo"));
  }
  if(s===2){
    if(REG.phone1.replace(/\D/g,"").length<8)return regErr(T("اكتب رقم ولي الأمر 1 بشكل صحيح","Enter guardian phone 1 correctly"));
    if(REG.phone2.trim()&&REG.phone2.replace(/\D/g,"").length<8)return regErr(T("رقم ولي الأمر 2 غير صحيح","Guardian phone 2 is not valid"));
    if(REG.ill&&REG.note.trim().length<2)return regErr(T("اذكر المرض أو الحساسية","Please describe the condition"));
  }
  if(s===3&&!REG.branch)return regErr(T("اختر الفرع","Choose a branch"));
  return true;
}
function regNext(){regSave();if(!regCheck(REG.step))return;REG.step++;regDraw()}
function regPrev(){regSave();if(REG.step>1){REG.step--;regDraw()}}
function regMail(o){try{return fetch("https://formsubmit.co/ajax/"+REG_MAIL,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(o),keepalive:true}).catch(function(){})}catch(e){return Promise.resolve()}}
function regDone(o){
  PUB=true;SHOP.info=o.pay||{};
  var b=brn(o.branch);
  render(shell('<div class="fc thx"><div style="font-size:52px">💙</div><h2>'+T("شكراً لاختيارك أكاديمية شووت","Thank you for choosing Shoot Academy")+'</h2>'+
    '<p>'+T("يسعدنا انضمام ","We are delighted to welcome ")+'<b>'+esc(o.name)+'</b>'+T(" إلى عائلة شووت. نؤمن أن كل لاعب موهوب يحتاج بيئة تدعمه، ونعدكم بتدريب احترافي ومتابعة دقيقة وتقارير دورية تُوثّق تطوره خطوة بخطوة، حتى يصنع مستقبله في الملاعب.",
      " to the Shoot family. Every talented player deserves an environment that supports him, and we promise professional coaching, close follow-up and regular reports that document his progress step by step, so he can build his future on the pitch.")+'</p>'+
    '<div class="rw"><span class="muted">'+T("رقم التسجيل","Registration no.")+'</span><b>#'+o.no+'</b></div><div class="rw"><span class="muted">'+T("الفرع","Branch")+'</span><b>'+T(b.ar,b.en)+'</b></div><div class="rw tot"><span>'+T("إجمالي الرسوم","Total fee")+'</span><b>'+money(o.total)+'</b></div></div>'+
    '<div class="fc"><h2>'+T("الخطوات المتبقية","Next steps")+'</h2><div class="nx"><i>1</i><span>'+T("أرسل رسالة التسجيل عبر واتساب (تُفتح جاهزة).","Send the registration message on WhatsApp (it opens ready).")+'</span></div><div class="nx"><i>2</i><span>'+T("حوّل الرسوم عبر بنفت أو الآيبان وأرفق صورة الإيصال.","Transfer the fee via Benefit or IBAN and attach the receipt photo.")+'</span></div><div class="nx"><i>3</i><span>'+T("سنتواصل معك لتأكيد مقعد اللاعب وإرسال كل التفاصيل. نتطلع لرؤيته في الملعب! ⚽","We will contact you to confirm the player's place and share all details. We look forward to seeing him on the pitch! ⚽")+'</span></div>'+
    '<a class="wa" href="'+esc(o.url)+'" target="_blank" rel="noopener">'+T("💬 إرسال التسجيل إلى واتساب","💬 Send registration to WhatsApp")+'</a></div>'+payBox()+'<button class="btn ghost block" onclick="home()">'+T("الرجوع للرئيسية","Back to home")+'</button>',
    {back:"home()",bg:"reg_bg",title:T("شكراً لك","Thank you"),sub:T("Welcome to Shoot Academy","أهلاً بك في أكاديمية شووت")}));
}
function regThanks(){var o=null;try{o=JSON.parse(ssGet("regdone")||"null")}catch(e){}if(o&&o.no)regDone(o);else home()}
function regSubmit(){
  regSave();var b0=$("rsb");if(b0.disabled)return;
  if(!REG.agree)return regErr(T("يجب الموافقة على سياسة الأكاديمية","You must agree to the Academy policy"));b0.disabled=true;b0.textContent=T("جاري الإرسال…","Sending…");
  rpc("reg_submit",{p_name:REG.name,p_phone1:REG.phone1,p_phone2:REG.phone2,p_cpr:REG.cpr,p_img:REG.img,p_ill:REG.ill,p_ill_note:REG.note,p_branch:REG.branch,p_extra:REG.extra}).then(function(r){
    FAR=true;
    var br=brn(REG.branch),p=regPlan(REG.branch),pay=REG.info.pay||{};
    var days=(p.days&&p.days.length)?p.days.map(dnA).join("، ")+" (4:30 - 6:00 م)":"سيتم تأكيدها معكم";
    var t="📝 تسجيل لاعب جديد - أكاديمية شووت\nرقم التسجيل: #"+r.no+"\nاسم اللاعب: "+REG.name+"\nالرقم الشخصي: "+REG.cpr+"\nجوال ولي الأمر 1: "+REG.phone1+(REG.phone2?"\nجوال ولي الأمر 2: "+REG.phone2:"")+
      "\nالحالة الصحية: "+(REG.ill?"يعاني: "+REG.note:"لا يعاني من أمراض")+"\nالفرع: "+br.ar+"\nأيام التدريب: "+days+(r.extra?"\nيوم إضافي: "+dnA(p.extra_day):"")+
      "\nالرسوم: "+money(r.total)+"\n\nالدفع: بنفت "+(pay.benefit||"")+" / آيبان "+(pay.iban||"")+"\nسأرفق صورة إيصال التحويل هنا ✅";
    var mail={_subject:"تسجيل لاعب جديد #"+r.no+" - "+REG.name,_template:"table",_captcha:"false",
      Registration_No:"#"+r.no,Player_Name:REG.name,Branch:br.ar,Training_Days:days,Extra_Day:r.extra?dnA(p.extra_day):"-",Fee:money(r.total),
      Guardian_Phone_1:REG.phone1,Guardian_Phone_2:REG.phone2||"-",Health:REG.ill?REG.note:"لا يعاني من أمراض",
      Details:"الرقم الشخصي وصورة البطاقة محفوظان في حساب المدير - تبويب التسجيلات"};
    FAR=false;
    var url=waUrl(pay.wa||WA[0],t),shown={no:r.no,total:r.total,name:REG.name,branch:REG.branch,url:url,pay:pay};
    var mp=regMail(mail);
    REG=JSON.parse(JSON.stringify(REG0));REG.info=null;
    ssSet("regdone",JSON.stringify(shown));
    setHash("#/thanks");regDone(shown);
    var tm=function(n){return new Promise(function(ok){setTimeout(ok,n)})};
    Promise.all([Promise.race([mp,tm(3000)]),tm(1800)]).then(function(){location.href=url});
  }).catch(function(x){FAR=false;var b=$("rsb");if(b){b.disabled=false;b.textContent=T("إرسال التسجيل","Submit")}regErr(errMsg(x))});
}

/* --- تبويب التسجيلات (للمدير) --- */
var RST=[["new","جديد"],["paid","تم الدفع"],["enrolled","تمت الإضافة كلاعب"],["cancel","ملغي"]];
function viewReg(){rpc("admin_reg_list",{p_tok:S.tok}).then(function(l){
  var nw=l.filter(function(x){return x.status==="new"}).length;
  var h='<div class="card"><h2>تسجيلات اللاعبين الجدد ('+l.length+')</h2><div class="muted">الجديدة: '+nw+' • اضغط «إضافة كلاعب» بعد استلام الرسوم، فيُنشأ اللاعب واشتراكه في فرعه تلقائياً.</div></div>';
  if(!l.length)h+='<div class="card"><p class="muted">لا توجد تسجيلات بعد.</p></div>';
  l.forEach(function(x){
    var wa=function(n){return"https://wa.me/"+(n.length===8?"973":"")+esc(n)};
    h+='<div class="card"><div class="row sp"><b>#'+x.no+' • '+fmt(x.day)+'</b><select style="width:auto;margin:0" onchange="setReg(\''+x.id+'\',this.value)">'+RST.map(function(s){return'<option value="'+s[0]+'"'+(x.status===s[0]?" selected":"")+'>'+s[1]+'</option>'}).join("")+'</select></div>'+
     '<div style="margin-top:8px;font-size:17px"><b>'+esc(x.name)+'</b></div>'+
     '<div class="muted">الرقم الشخصي: <span class="ltr">'+esc(x.cpr)+'</span></div>'+
     '<div style="margin-top:6px"><a href="tel:'+esc(x.phone1)+'" class="ltr">'+esc(x.phone1)+'</a> • <a href="'+wa(x.phone1)+'" target="_blank" rel="noopener">واتساب</a>'+(x.phone2?'<br><a href="tel:'+esc(x.phone2)+'" class="ltr">'+esc(x.phone2)+'</a> • <a href="'+wa(x.phone2)+'" target="_blank" rel="noopener">واتساب</a>':'')+'</div>'+
     '<div style="margin-top:6px"><span class="tag">'+brn(x.branch).ar+'</span> '+(x.extra?'<span class="tag org">+ يوم إضافي</span> ':'')+'<span class="tag grn">'+money(x.price)+'</span> '+(x.ill?'<span class="tag red">حالة صحية</span>':'')+'</div>'+
     (x.ill&&x.ill_note?'<div class="need">'+esc(x.ill_note)+'</div>':'')+
     '<div class="row" style="margin-top:10px">'+(x.has_img?'<button class="btn ghost sm" onclick="regIdView(\''+x.id+'\')">🪪 صورة البطاقة</button>':'')+(x.status!=="enrolled"?'<button class="btn sm" onclick="regEnroll(\''+x.id+'\')">✅ إضافة كلاعب</button>':'')+'<button class="btn ghost sm" onclick="regDel(\''+x.id+'\')">🗑 حذف</button></div></div>'});
  $("cb").innerHTML=h}).catch(authFail)}
function setReg(id,s){rpc("admin_reg_status",{p_tok:S.tok,p_id:id,p_status:s}).then(function(){toast("تم تحديث الحالة")}).catch(authFail)}
function regIdView(id){rpc("admin_reg_img",{p_tok:S.tok,p_id:id}).then(function(r){if(r&&r.src)openImg(r.src);else toast("لا توجد صورة")}).catch(authFail)}
function regEnroll(id){if(!confirm("إضافة هذا اللاعب إلى فرعه مع اشتراك هذا الشهر؟"))return;var paid=confirm("هل استلمت الرسوم؟ (موافق = مدفوع، إلغاء = غير مدفوع)");
  rpc("admin_reg_enroll",{p_tok:S.tok,p_id:id,p_paid:paid}).then(function(){toast("تمت إضافة اللاعب");viewReg()}).catch(authFail)}
function regDel(id){if(!confirm("حذف هذا التسجيل نهائياً؟"))return;rpc("admin_reg_del",{p_tok:S.tok,p_id:id}).then(function(){toast("تم الحذف");viewReg()}).catch(authFail)}

function route(){
  var h=location.hash,m;
  if((m=h.match(/^#\/p\/([0-9a-f-]{36})$/i)))return profile(m[1]);
  if((m=h.match(/^#\/b\/(\w+)$/)))return branch(m[1]);
  if(h==="#/shop")return shop();
  if(h==="#/register")return regOpen();
  if(h==="#/policy")return policy();
  if(h==="#/thanks")return regThanks();
  if(h==="#/parents")return parents();
  if(h==="#/coach")return coachLogin();
  home();
}
window.addEventListener("hashchange",function(){if(location.hash!==_cur){_cur=location.hash;route()}});
loadSlots();
route();
</script>
